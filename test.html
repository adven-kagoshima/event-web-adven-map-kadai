<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
<style>
.container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.left, .right {
  width: 100px;
}

.center {
  flex: 1;              /* 残りを中央要素が占める */
  text-align: center;
}
</style>
  </head>
  <body>
    <div class="container">
        <div class="left">左</div>
        <div class="center">中央</div>
        <div class="right">右</div>
</div>
</body>
</html>
