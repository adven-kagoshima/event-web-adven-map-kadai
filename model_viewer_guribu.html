<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぐりぶー & さくら</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        model-viewer {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>

<body>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <model-viewer
        alt=""
        src="model\guribu.glb"
        ar
        poster="shared-assets/models/NeilArmstrong.webp"
        shadow-intensity="1" 
        camera-controls 
        touch-action="pan-y">
    </model-viewer>
    <model-viewer
        alt=""
        src="model\sakura.glb"
        ar
        poster="shared-assets/models/NeilArmstrong.webp"
        shadow-intensity="1" 
        camera-controls 
        touch-action="pan-y">
    </model-viewer>
</body>

</html>
