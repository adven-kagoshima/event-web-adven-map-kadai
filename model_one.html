<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹿児島方言アドベンチャー</title>
    <meta name="description" content="鹿児島方言アドベンチャーの3Dモデルを表示しよう！">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:wght@100..900&family=M+PLUS+Rounded+1c:wght@400;800&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v6.4.2/css/all.css" rel="stylesheet">
    <meta property="og:title" content="鹿児島方言アドベンチャー">
    <meta property="og:site_name" content="鹿児島方言アドベンチャー">
    <meta property="og:description" content="鹿児島方言アドベンチャーの3Dモデルを表示しよう！">
    <meta property="og:image" content="https://adven-map-kadai.github.io/">
    <meta property="og:type" content="website">
    <style>
    body {
        margin: 0;
        font-family: "M PLUS Rounded 1c", sans-serif;
        overflow: hidden; /* スクロール禁止 */
        -webkit-overflow-scrolling: none; /* iOS の慣性スクロールも無効化 */
    }
    h1 {
        font-weight: 800;
        font-style: normal;
        text-align: center;
    }
    h2 {
        font-weight: 600;
        color: #7b6459;/*文字色*/
        text-align: left;
    }
    h3 {
        font-weight: 600;
        color: #7b6459;/*文字色*/
        text-align: center;
    }
    h4 {
        font-weight: 600;
        color: #7b6459;/*文字色*/
        text-align: right;
    }
    header p {
        font-weight: 600;
        color: #7b6459;/*文字色*/
        text-align: center;
    }
    header menu {
        font-weight: 600;
        color: #7b6459;/*文字色*/
        text-align: center;
    }
    header menu ul {
        list-style: none;
        padding: 0 0 20px 0;
        display: flex;
        justify-content: center;
        gap: 20px;
    }
    footer p {
        font-weight: 600;
        color: #7b6459;/*文字色*/
        text-align: center;
    }
    .container{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    model-viewer {
        width: 100vw;
        height: 50vh;
        display: block;
    }
    </style>
    <script>
    const model_data = {
      "sattun": ["原囿晴", "さっつん"],
      "amu": ["原囿晴", "アミュプラザ鹿児島"],
      "shimazuyoshihiro": ["原囿晴", "島津義弘"],
      "sakurajimadaikon": ["髙倉秀真", "桜島大根"],
      "tsun": ["田中卓磨", "ツン"],
      "satsumaimo": ["永田青旺", "さつま芋"],
      "kagoshimaarena": ["長﨑亮仁", "鹿児島アリーナ"],
      "saigotakamori": ["松元彩菜", "西郷隆盛"],
      "okubotoshimichi": ["梅山大智", "大久保利通"],
      "kagoshimasuizokukan": ["梅山大智", "かごしま水族館"],
      "hirakawadoubutsuen": ["梅山大智", "平川動物公園"],
      "kagoshimashiden1": ["梅木敢太", "鹿児島市電"],
      "goromon": ["関康生", "鶴丸城 御楼門"],
      "senganen": ["田中創太", "仙巌園"],
      "gakutyou": ["野口しおり", "鹿児島大学学長"],
      "guribu": ["野口しおり", "ぐりぶー"],
      "sakura": ["野口しおり", "さくら"],
      "onsen": ["野口しおり", "温泉"],
      "rurikakesu": ["野口しおり", "ルリカケス"],
      "kanban": ["野口しおり", "看板"],
      "rikuzyoukyougijyou": ["愛甲将太", "鴨池陸上競技場"],
      "kagakukan": ["井原悠登", "鹿児島市立科学館"],
      "sakurajimaferry": ["上籠健人", "桜島フェリー"],
      "kagoshimakentyou": ["坂本知太", "鹿児島県庁"],
      "oukan": ["大久保健太", "王冠"],
      "iruka1": ["谷口玲奈", "イルカ"],
      "atsuhime": ["谷口桃子", "篤姫"],
      "kagoshimadaigaku": ["谷口桃子", "鹿児島大学"],
      "shirokuma-kakigori": ["谷口桃子", "しろくま(かき氷)"],
      "koara": ["宿里梨心", "コアラ"],
    };

    document.addEventListener('DOMContentLoaded',()=>{
        console.log('search:'+location.search);
        const params = new URLSearchParams(location.search);
        const m = params.get('m');

        if (m in model_data) {
            const [model_creator, model_info] = model_data[m];

            const viewer = document.querySelector("model-viewer");
            const model_name = document.getElementById("model_name");
            const creator_name = document.getElementById("creator_name");

            document.querySelector("title").textContent = model_info + " - 鹿児島方言アドベンチャー";
            document.querySelector('meta[property="og:title"]').setAttribute("content", model_info + " - 鹿児島方言アドベンチャー");

            viewer.src="models/" + m +".glb";
            viewer.alt = model_info;

            model_name.textContent = model_info;
            creator_name.textContent = model_creator;
        } else {
            const container = document.querySelector(".container");
            container.innerHTML = "<h2>3Dモデルが見つかりません。</h2>";
        }
    });
    </script>
    <!-- Import the component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>

<body>
<header>
    <h1>鹿児島方言アドベンチャー</h1>

    <p>3Dモデルをクリック・タップして、回転・拡大縮小してみよう！</p>
</header>

<section class="container">
    <div>
        <h2 id="model_name">鹿児島方言アドベンチャー</h2>
        <!-- Use it like any other HTML element -->
        <!-- poster: Loading用の画像 -->
        <!-- environment-image: 画像で環境反射をシミュレート -->
        <!-- shadow-intensity: model-viewerの照明による陰影の強度(デフォルト:0, 1に近いほど値が1に近いほど、陰影の濃さがます) -->
        <!-- camera-controls: 3Dモデルを操作するためのカメラコントロールを有効 -->
        <!-- touch-action: モバイル端末で3Dモデルをタッチ操作する場合のブラウザのデフォルトのタッチアクションを変更  -->
        <model-viewer
            alt=""
            src="model\sattun.glb"
            ar
            poster="shared-assets/models/NeilArmstrong.webp"
            shadow-intensity="1" 
            camera-controls 
            touch-action="pan-y">
        </model-viewer>
        <h4><i class="fas fa-user-edit"></i>3Dモデルクリエイター:<span id="creator_name">鹿児島大学</span></h4>
    </div>
</section>

<script>
document.write(`<ul style="list-style-type: none; padding: 0; margin: 0;">`);
for (const key in model_data) {
    document.write(`<li style="margin:5px; display: inline-block; margin-right: 10px;"><a href="${window.location.origin}${window.location.pathname}?m=${key}">${model_data[key][1]}</a></li>`);
}
document.write(`</ul>`);
</script>
<footer>
    <p>鹿児島方言アドベンチャー</p>
</footer>
</body>
</html>
