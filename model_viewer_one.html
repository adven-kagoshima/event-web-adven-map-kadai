    <style>
    body {
        margin: 0;
        font-family: "M PLUS Rounded 1c", sans-serif;
    }
    h1 {
        font-weight: 800;
        font-style: normal;
    }
    .container{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    model-viewer {
        width: 100vw;
        height: 50vh;
        display: block;
    }
    p {
        color: #7b6459;/*文字色*/
        text-align: right;
    }
    </style>
    <script>
    const model_data = {
      "sattun": ["原囿晴", "さっつん"],
      "amuran": ["原囿晴", "アミュ"],
      "shimazuyoshihiro": ["原囿晴", "島津義弘"],
      "sakurajimadaikon": ["髙倉秀真", "桜島大根"],
      "tsun": ["田中卓磨", "ツン"],
      "satumaimo": ["永田青旺", "さつまいも"],
      "arena": ["長﨑亮仁", "鹿児島アリーナ"],
      "okubotoshimichi": ["梅山大智", "大久保利通"],
      "suizokukan": ["梅山大智", "水族館"],
      "hirakawadoubutsuen": ["梅山大智", "平川動物公園"],
      "kagoshimashiden": ["梅木敢太", "市電"],
      "goromon": ["関康生", "鶴丸城 御楼門"],
      "senganen": ["田中創太", "仙巌園"],
      "gakutyou": ["野口しおり", "学長"],
      "guribu": ["野口しおり", "ぐりぶー"],
      "sakura": ["野口しおり", "さくら"],
      "onsen": ["野口しおり", "温泉"],
      "rurikakesu": ["野口しおり", "ルリカケス"],
      "rikuzyoukyougijyou": ["愛甲将太", "鴨池陸上競技場"],
      "kagakukan": ["井原悠登", "科学館"],
      "sakurajimaferry": ["上籠健人", "桜島フェリー"],
      "kentyou": ["坂本知太", "県庁"],
      "oukan": ["大久保健太", "王冠"],
      "iruka": ["谷口玲奈", "イルカ"],
      "atsuhime": ["谷口桃子", "篤姫"],
      "kagosimadaigaku": ["谷口桃子", "鹿児島大学"],
      "koara": ["宿里梨心", "コアラ"],
    };

    document.addEventListener('DOMContentLoaded',()=>{
        console.log('search:'+location.search);
        const params = new URLSearchParams(location.search);
        const m = params.get('m');

        if (m in model_data) {
            const [model_creator, model_info] = model_data[m];

            const viewer = document.querySelector("model-viewer");
            const model_name = document.getElementById("model_name");
            const creator_name = document.getElementById("creator_name");

            document.querySelector("title").textContent = model_info + " - 鹿児島方言アドベンチャー";
            document.querySelector('meta[property="og:title"]').setAttribute("content", model_info + " - 鹿児島方言アドベンチャー");

            viewer.src="model/" + m +".glb";
            viewer.alt = model_info;

            model_name.textContent = model_info;
            creator_name.textContent = model_creator;
        } else {
            const container = document.querySelector(".container");
            container.innerHTML = "<h2>3Dモデルが見つかりません。</h2>";
        }
    });
    </script>
</head>

<body>
    <!-- Import the component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<header>
    <h1>鹿児島方言アドベンチャー</h1>
</header>

<section class="container">
    <h2 id="model_name">鹿児島方言アドベンチャー</h2>
    <!-- Use it like any other HTML element -->
    <!-- poster: Loading用の画像 -->
    <!-- environment-image: 画像で環境反射をシミュレート -->
    <!-- shadow-intensity: model-viewerの照明による陰影の強度(デフォルト:0, 1に近いほど値が1に近いほど、陰影の濃さがます) -->
    <!-- camera-controls: 3Dモデルを操作するためのカメラコントロールを有効 -->
    <!-- touch-action: モバイル端末で3Dモデルをタッチ操作する場合のブラウザのデフォルトのタッチアクションを変更  -->
    <model-viewer
        alt=""
        src="model\sattun.glb"
        ar
        poster="shared-assets/models/NeilArmstrong.webp"
        shadow-intensity="1" 
        camera-controls 
        touch-action="pan-y">
    </model-viewer>
    <h4><i class="fas fa-user-edit"></i>3Dモデルクリエイター:<span id="creator_name">鹿児島大学</span></h4>
</section>
