<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>さっつん</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロール禁止 */
            -webkit-overflow-scrolling: none; /* iOS の慣性スクロールも無効化 */
        }
        model-viewer {
            width: 100vw;
            height: 100vh;
            display: block;
        }
         /* ボタンは下に固定 */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-size: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }

    </style>
</head>

<body>
    
    <!-- Import the component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

    <!-- Use it like any other HTML element -->
    <!-- poster: Loading用の画像 -->
    <!-- environment-image: 画像で環境反射をシミュレート -->
    <!-- shadow-intensity: model-viewerの照明による陰影の強度(デフォルト:0, 1に近いほど値が1に近いほど、陰影の濃さがます) -->
    <!-- camera-controls: 3Dモデルを操作するためのカメラコントロールを有効 -->
    <!-- touch-action: モバイル端末で3Dモデルをタッチ操作する場合のブラウザのデフォルトのタッチアクションを変更  -->
    <model-viewer
        alt=""
        src="model/sattun.glb"
        ar
        autoplay
        poster="shared-assets/models/NeilArmstrong.webp"
        shadow-intensity="1" 
        animationName=""
        camera-controls 
        touch-action="pan-y">
    </model-viewer>
    
<!-- モデル切り替え -->
  <div class="controls">
    <button onclick="setModel('sattun.glb')">さっつん</button>
    <button onclick="setModel('Capoeira Mixamo.glb')">カポエイラ</button>
    <button onclick="setModel('Key.glb')">キー</button>
  </div>

 <script>
    const viewer = document.querySelector("model-viewer");

    // モデル切り替え
    function setModel(fileName) {
      viewer.src = "model/" + fileName;
      viewer.animationName = null; // アニメーションをクリア
      console.log("切り替え:", fileName);
    }

    // アニメーション切り替え
    function setAnimation(name) {
      viewer.animationName = name;
      viewer.paused = false;
      console.log("再生中:", name);
    }

    // 読み込み時にアニメーション一覧確認
    viewer.addEventListener("model-visibility", () => {
      console.log("利用可能アニメーション:", viewer.availableAnimations);
      // Idle があれば自動再生する
      if (viewer.availableAnimations.includes("Idle")) {
        setAnimation("Idle");
      }
    });

    // モデルクリック時にアニメーション再生
    // viewer.addEventListener("click", () => {
    //   // 例: Idleアニメーションを再生
    //   if (viewer.availableAnimations && viewer.availableAnimations.length > 0) {
    //     setAnimation(viewer.availableAnimations[0]);
    //   }

    //   // 再生開始
    //   // viewer.play();
    //   // viewer.play({animationName: 'Welcome'}); //ループ
    //   // viewer.play({animationName: 'Welcome', repetitions: 1}); //1回ループ
    //   // viewer.pause();
    // });
  </script>


</body>

</html>
